name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ['1.27.x']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  # The server keeps a registration table, an object store and per-registration
  # downlink clients, and the expiry sweep runs on its own goroutine: the race
  # detector is where a lifecycle bug shows up first. Ubuntu only — one platform
  # runs the detector meaningfully, and three would triple the slowest job.
  race:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Test with the race detector
        run: go test -race ./...

  # Two short fuzz runs over what a device controls: a TLV write body (codec plus
  # the object write path) and the registration request fields. Ten seconds each
  # catches the cheap crashes without turning CI into a fuzzing farm; a longer run
  # is a local or nightly job.
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Fuzz the TLV write path
        run: go test -run '^$' -fuzz FuzzDecodeTLV -fuzztime 10s .
      - name: Fuzz registration requests
        run: go test -run '^$' -fuzz FuzzDecodeRegistration -fuzztime 10s .

  # Interoperability runs a real LwM2M client — the Eclipse Leshan client demo, a
  # Java/Californium implementation — against this server. The jar is fetched here
  # rather than committed; the JDK comes with the ubuntu image. The tests skip
  # themselves when either is missing, so this job is the one that proves them.
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
      - name: Fetch the Leshan client demo
        working-directory: interop
        run: |
          curl -sSO https://repo1.maven.org/maven2/org/eclipse/leshan/leshan-client-demo/2.0.0-M15/leshan-client-demo-2.0.0-M15-jar-with-dependencies.jar
          mv leshan-client-demo-2.0.0-M15-jar-with-dependencies.jar leshan-client-demo.jar
      - name: Interoperability tests
        working-directory: interop
        run: go test -tags=integration -timeout 5m ./...
